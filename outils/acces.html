<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050914">
<meta name="robots" content="noindex, nofollow">
<title>Prévoyance — accès privé</title>
<link rel="icon" href="web/images/icone-192.png">
<link rel="stylesheet" href="web/polices/polices.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; color: #f2f6ff;
  font: 400 17px/1.5 'Inter', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  background: #050914 url(web/images/film/f-288.webp) center / cover no-repeat fixed; }
body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(180deg, rgba(5, 9, 20, .55), rgba(5, 9, 20, .82)); }
main { position: relative; width: min(440px, 100%); padding: 40px 34px 34px; border-radius: 30px; text-align: center;
  background: linear-gradient(180deg, rgba(20, 34, 66, .78), rgba(9, 16, 34, .84)); border: 1px solid rgba(169, 201, 255, .2);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .1) inset, 0 50px 120px -40px rgba(0, 0, 0, .9); backdrop-filter: blur(26px) saturate(1.4); -webkit-backdrop-filter: blur(26px) saturate(1.4);
  animation: entree .9s cubic-bezier(.22, 1, .36, 1) both; }
@keyframes entree { from { opacity: 0; transform: translateY(26px); } }
img { width: 56px; height: 56px; border-radius: 15px; box-shadow: 0 14px 34px -14px rgba(0, 0, 0, .8); }
p.sur { margin: 22px 0 10px; font-size: 12.5px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: #a9c9ff; }
h1 { margin: 0; font: 500 44px/1 'Fraunces', Georgia, serif; letter-spacing: -.02em; }
p.texte { margin: 14px 0 26px; color: #d5dff2; }
form { display: grid; gap: 14px; }
label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
input { width: 100%; min-height: 56px; padding: 0 20px; border-radius: 16px; border: 1px solid rgba(169, 201, 255, .24); background: rgba(169, 201, 255, .08);
  color: #fff; font: 600 18px/1 'Inter', sans-serif; letter-spacing: .14em; text-align: center; text-transform: uppercase; outline: none; transition: border-color .3s, box-shadow .3s; }
input::placeholder { color: #8292b3; letter-spacing: .04em; text-transform: none; font-weight: 500; }
input:focus { border-color: #a9c9ff; box-shadow: 0 0 0 5px rgba(169, 201, 255, .16); }
button { min-height: 56px; border: 0; border-radius: 999px; cursor: pointer; font: 600 16px/1 'Inter', sans-serif; color: #06122b;
  background: linear-gradient(180deg, #cfe1ff, #8fb4ff); box-shadow: 0 0 0 1px rgba(255, 255, 255, .35) inset, 0 14px 40px -12px rgba(111, 157, 255, .75); transition: transform .3s; }
button:hover { transform: translateY(-2px); }
p.erreur { min-height: 1.5em; margin: 2px 0 0; font-size: 15px; color: #ffd9a8; }
main.refus { animation: refus .4s; }
@keyframes refus { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
small { display: block; margin-top: 18px; color: #a3b2cf; font-size: 13.5px; }
@media (prefers-reduced-motion: reduce) { main, main.refus { animation: none; } }
</style>
</head>
<body>
<main id="carte">
  <img src="web/images/icone-192.png" alt="">
  <p class="sur">Version d’essai</p>
  <h1>Accès privé</h1>
  <p class="texte">Cette page est réservée aux personnes invitées. Saisissez le code qui vous a été remis.</p>
  <form id="porte" autocomplete="off">
    <label for="code">Code d’accès</label>
    <input id="code" name="code" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="Code d’accès" required>
    <button type="submit">Entrer</button>
    <p class="erreur" id="erreur" role="alert"></p>
  </form>
  <small>Prévoyance · site de démonstration, non public</small>
</main>
<script>
(function () {
  var ATTENDU = '__EMPREINTE__', SEL = '__SEL__', CLE = 'prevoyance.acces';
  function empreinte(texte) {
    var octets = new TextEncoder().encode(texte), h = 0x811c9dc5;
    for (var i = 0; i < octets.length; i++) h = Math.imul(h ^ octets[i], 0x01000193) >>> 0;
    return ('0000000' + h.toString(16)).slice(-8);
  }
  function entrer() { location.replace('web/bienvenue.html'); }
  try { if (sessionStorage.getItem(CLE) === ATTENDU) return entrer(); } catch (e) { /* stockage indisponible */ }
  document.getElementById('porte').addEventListener('submit', function (evenement) {
    evenement.preventDefault();
    var code = document.getElementById('code').value.trim().toUpperCase();
    if (empreinte(SEL + code) + empreinte(code + SEL) === ATTENDU) {
      try { sessionStorage.setItem(CLE, ATTENDU); } catch (e) { /* rien */ }
      entrer();
    } else {
      var carte = document.getElementById('carte');
      document.getElementById('erreur').textContent = 'Ce code n’est pas reconnu.';
      carte.classList.remove('refus'); void carte.offsetWidth; carte.classList.add('refus');
    }
  });
})();
</script>
</body>
</html>
