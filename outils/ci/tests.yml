name: Moteur de calcul

on:
  push:
    paths: ['moteur/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['moteur/**']

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cas de test du moteur
        run: node moteur/tests/run.mjs
