<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Prévoyance — un univers, trois écrans</title>
<!-- Un univers de design montré sur trois écrans de l'app : accueil, dossier du client, analyse.
     ?v=nuit|a|b|c|d|e|f choisit l'univers. Les scènes sont générées (Higgsfield) ; planches rendues en image par Edge. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1640px; height: 1180px; background: var(--planche); font-family: var(--police); display: grid; grid-template-rows: auto 1fr; padding: 44px 0 0; }
  header { text-align: center; color: var(--legende); }
  header b { display: block; font: 700 34px/1.1 -apple-system, "Segoe UI", sans-serif; letter-spacing: -.02em; }
  header span { font: 400 18px -apple-system, "Segoe UI", sans-serif; opacity: .7; }
  main { display: flex; gap: 54px; justify-content: center; align-items: center; }
  figure { display: grid; gap: 14px; justify-items: center; }
  figcaption { font: 600 14px -apple-system, "Segoe UI", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: var(--legende); opacity: .6; }
  .tel { width: 430px; height: 932px; border-radius: 62px; padding: 14px; background: #0c0c0e; box-shadow: 0 50px 90px -40px rgba(0, 0, 0, .55); }
  .ecran { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: var(--fond); color: var(--encre); }
  .ile { position: absolute; left: 50%; top: 14px; width: 118px; height: 34px; margin-left: -59px; border-radius: 20px; background: #000; z-index: 5; }
  .heure { position: absolute; left: 36px; top: 21px; font: 600 16px -apple-system, "Segoe UI", sans-serif; z-index: 5; color: var(--heure, var(--encre)); }
  .sur { font: var(--sur-police, 600 12px -apple-system, "Segoe UI", sans-serif); letter-spacing: var(--sur-espace, .3em); text-transform: uppercase; color: var(--discret); }
  .titre { font: var(--titre-police); letter-spacing: var(--titre-espace, -.03em); }
  .panneau { background: var(--panneau); border: var(--panneau-bord); border-radius: var(--rayon); box-shadow: var(--panneau-ombre, none); }
  .cta { display: grid; place-items: center; height: 56px; border-radius: var(--rayon-bouton); background: var(--cta); color: var(--cta-encre); font: 600 17px -apple-system, "Segoe UI", sans-serif; box-shadow: var(--cta-ombre, none); }
  .cta.second { background: var(--second); color: var(--encre); border: var(--second-bord, 0); font-weight: 500; box-shadow: none; }
  .barre { position: absolute; left: 18px; right: 18px; bottom: 22px; height: 66px; border-radius: var(--rayon-barre); background: var(--barre); border: var(--panneau-bord); display: flex; justify-content: space-around; align-items: center;
    font: 600 11px -apple-system, "Segoe UI", sans-serif; color: var(--discret); box-shadow: var(--panneau-ombre, none); z-index: 4; }
  .barre b { padding: 12px 14px; border-radius: var(--rayon-bouton); background: var(--actif); color: var(--actif-encre); }

  /* accueil */
  .accueil { background-image: var(--scene); background-size: cover; background-position: center top; }
  .accueil .voile { position: absolute; inset: 0; background: var(--voile); }
  .accueil .bas { position: absolute; left: 26px; right: 26px; bottom: 44px; }
  .accueil .titre { font-size: 40px; line-height: 1.05; margin: 12px 0 24px; }
  .ligne-dossier { display: flex; align-items: center; gap: 14px; height: 78px; padding: 0 18px; }
  .ligne-dossier svg { width: 46px; height: 46px; flex: none; transform: rotate(-90deg); }
  .ligne-dossier div { flex: 1; font-family: -apple-system, "Segoe UI", sans-serif; } .ligne-dossier b { display: block; font-size: 18px; } .ligne-dossier span { font-size: 14px; color: var(--discret); }
  .duo { display: flex; gap: 12px; margin-top: 14px; } .duo .cta:first-child { flex: 1; } .duo .cta.second { padding: 0 22px; }

  /* dossier */
  .dossier, .analyse { padding: 72px 22px 0; }
  .dossier .titre, .analyse .titre { font-size: 34px; margin: 6px 0 4px; }
  .dossier > p, .analyse > p.note { font: 400 15px -apple-system, "Segoe UI", sans-serif; color: var(--discret); margin-bottom: 18px; }
  .champs { padding: 2px 18px; font-family: -apple-system, "Segoe UI", sans-serif; }
  .champs p { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--filet); font-size: 16px; }
  .champs p:last-child { border-bottom: 0; }
  .champs p b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .champs p i { font-style: normal; color: var(--discret); }
  .interrupteur { width: 50px; height: 30px; border-radius: 15px; background: var(--accent); position: relative; }
  .interrupteur::after { content: ""; position: absolute; right: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; }
  .rubriques { display: flex; gap: 8px; margin: 16px 0 14px; font: 600 13px -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  .rubriques span { padding: 9px 14px; border-radius: var(--rayon-bouton); background: var(--second); border: var(--second-bord, 0); white-space: nowrap; color: var(--discret); }
  .rubriques span.actif { background: var(--actif); color: var(--actif-encre); border-color: transparent; }

  /* analyse */
  .nombre { font: var(--nombre-police); letter-spacing: -.045em; color: var(--nombre, var(--encre)); margin: 8px 0 2px; }
  .nombre small { font: 400 16px -apple-system, "Segoe UI", sans-serif; letter-spacing: 0; color: var(--discret); margin-left: 8px; }
  .tete { padding: 20px 20px 18px; }
  .tete .champs { padding: 0; margin: 10px 0 14px; }
  .risques { margin-top: 14px; padding: 4px 18px; font-family: -apple-system, "Segoe UI", sans-serif; }
  .risque { padding: 13px 0; border-bottom: 1px solid var(--filet); }
  .risque:last-child { border-bottom: 0; }
  .risque p { display: flex; justify-content: space-between; font-size: 16px; } .risque p b { font-weight: 600; }
  .risque div { height: 4px; border-radius: 2px; background: var(--filet); margin-top: 9px; overflow: hidden; } .risque div i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

  /* ---------- autres dispositions de menu (paramètre m) */
  /* étapes : le rendez-vous comme un parcours, en haut de l'écran ; le pas suivant en bas */
  .etapes { display: flex; align-items: center; gap: 0; margin: 2px 0 18px; font: 600 11px -apple-system, "Segoe UI", sans-serif; color: var(--discret); }
  .etapes span { display: grid; justify-items: center; gap: 6px; flex: none; width: 56px; }
  .etapes span i { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--filet); font-style: normal; font-size: 12px; background: var(--fond); }
  .etapes span.fait i { background: var(--encre); border-color: var(--encre); color: var(--fond); }
  .etapes span.ici { color: var(--encre); } .etapes span.ici i { background: var(--accent); border-color: var(--accent); color: var(--actif-encre); }
  .etapes em { flex: 1; height: 1.5px; background: var(--filet); margin-bottom: 18px; } .etapes em.fait { background: var(--encre); }
  .suivant { position: absolute; left: 22px; right: 22px; bottom: 30px; display: flex; gap: 10px; }
  .suivant .cta { flex: 1; } .suivant .cta.second { flex: none; width: 56px; padding: 0; }
  /* tuiles : pas de barre ; l'accueil est un sommaire, chaque écran revient à l'accueil */
  .tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; font-family: -apple-system, "Segoe UI", sans-serif; }
  .tuiles div { padding: 14px 16px; min-height: 84px; display: grid; align-content: space-between; }
  .tuiles div b { font-size: 16px; } .tuiles div span { font-size: 12.5px; color: var(--discret); }
  .tuiles div.large { grid-column: 1 / -1; min-height: 0; display: flex; justify-content: space-between; align-items: center; }
  .retour { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px; margin-bottom: 14px; border-radius: var(--rayon-bouton); background: var(--second); border: var(--second-bord, 0);
    font: 600 14px -apple-system, "Segoe UI", sans-serif; color: var(--encre); }
  /* socle : une barre basse avec le geste principal au centre */
  .socle { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; padding: 0 26px 22px; display: flex; justify-content: space-between; align-items: center; background: var(--barre); border-top: var(--panneau-bord);
    font: 600 11px -apple-system, "Segoe UI", sans-serif; color: var(--discret); z-index: 4; }
  .socle span { width: 58px; text-align: center; } .socle span.ici { color: var(--encre); }
  .socle b { width: 68px; height: 68px; margin-top: -34px; border-radius: 50%; display: grid; place-items: center; background: var(--cta); color: var(--cta-encre); font-size: 13px; box-shadow: 0 14px 28px -10px rgba(0, 0, 0, .5); border: 4px solid var(--fond-uni, var(--barre)); }
</style>

      cta: '#27348b', 'cta-encre': '#fbf9f4', second: '#fbf9f4', 'second-bord': '1px solid #17171a', barre: '#fbf9f4', actif: '#17171a', 'actif-encre': '#fbf9f4' }],
    i: ['I — Aurore', 'Au-dessus des nuages à l’aube, chrome, or rose et cristal. Ambitieux, lumineux.', { menu: 'socle', scene: 'variante-i.png', planche: '#e6dfe9', legende: '#241a3a', police: SANS, fond: 'linear-gradient(170deg, #f7f1fb, #fdf3ee)', 'fond-uni': '#fbf3f6', encre: '#241a3a', discret: '#857a99', filet: '#eadff0', accent: '#e0567a',
      'heure-scene': '#fff', voile: voile('rgba(250,243,247,X)'), 'titre-police': `700 34px ${SANS}`, 'nombre-police': `700 50px ${SANS}`, nombre: '#5b3fd6', panneau: 'rgba(255,255,255,.85)', 'panneau-bord': '1px solid #fff', 'panneau-ombre': '0 20px 40px -24px rgba(91,63,214,.4)', rayon: '26px', 'rayon-bouton': '26px', 'rayon-barre': '0',
      cta: 'linear-gradient(120deg,#5b3fd6,#e0567a 70%,#f6a26b)', 'cta-encre': '#fff', 'cta-ombre': '0 14px 28px -12px rgba(224,86,122,.6)', second: '#fff', 'second-bord': '1px solid #eadff0', barre: '#fff', actif: '#241a3a', 'actif-encre': '#fff' }],
  });
  const parametres = new URLSearchParams(location.search);
  const v = parametres.get('v') ?? 'nuit', [nom, phrase, jetons] = UNIVERS[v] ?? UNIVERS.nuit;
  // disposition du menu : celle de l'univers, ou celle demandée (m=barre|etapes|tuiles|socle)
  const menu = parametres.get('m') ?? jetons.menu ?? 'barre';
  const NOMS_MENU = { barre: 'barre d’onglets flottante', etapes: 'parcours en cinq étapes', tuiles: 'sommaire en tuiles, sans barre', socle: 'socle avec le geste principal au centre' };
  addEventListener('DOMContentLoaded', () => {
    document.getElementById('phrase').textContent += ` Menu : ${NOMS_MENU[menu]}.`;
    const ETAPES = ['Dossier', 'Analyse', 'Scénarios', 'Conseil', 'Rapport'];
    for (const ecran of document.querySelectorAll('.dossier, .analyse')) {
      const ici = ecran.classList.contains('dossier') ? 0 : 1, barre = ecran.querySelector('.barre');
      if (menu === 'barre') continue;
      barre.remove();
      if (menu === 'etapes') {
        const parcours = document.createElement('div');
        parcours.className = 'etapes';
        parcours.innerHTML = ETAPES.map((e, i) => `${i ? `<em class="${i <= ici ? 'fait' : ''}"></em>` : ''}<span class="${i < ici ? 'fait' : i === ici ? 'ici' : ''}"><i>${i < ici ? '✓' : i + 1}</i>${e}</span>`).join('');
        ecran.querySelector('.sur').after(parcours);
        ecran.querySelector('.rubriques')?.remove();
        for (const cta of ecran.querySelectorAll(':scope > .cta, .tete .cta')) cta.remove();
        ecran.insertAdjacentHTML('beforeend', `<div class="suivant"><div class="cta second">‹</div><div class="cta">Suivant : ${ETAPES[ici + 1]} →</div></div>`);
      } else if (menu === 'tuiles') {
        ecran.querySelector('.sur').insertAdjacentHTML('beforebegin', '<div class="retour">‹ Sommaire</div>');
      } else if (menu === 'socle') {
        ecran.insertAdjacentHTML('beforeend', `<div class="socle"><span class="${ici === 0 ? 'ici' : ''}">Dossier</span><span>Scénarios</span><b>Analyse</b><span>Conseil</span><span>Rapport</span></div>`);
      }
    }
    if (menu === 'tuiles') {
      const bas = document.querySelector('.accueil .bas');
      bas.querySelector('.duo').remove();
      bas.querySelector('.titre').style.cssText = 'font-size:32px;margin:10px 0 16px';
      bas.insertAdjacentHTML('beforeend', `<div class="tuiles" style="margin-top:10px"><div class="panneau"><b>Dossier</b><span>10 rubriques</span></div><div class="panneau"><b>Analyse</b><span>score 92</span></div>
        <div class="panneau"><b>Scénarios</b><span>7 simulations</span></div><div class="panneau"><b>Conseil</b><span>5 mesures</span></div><div class="panneau large"><b>Rapport PDF</b><span>10 pages ›</span></div></div>`);
      bas.style.bottom = '26px';
    }
    if (menu === 'etapes') document.querySelector('.accueil .duo .cta').textContent = 'Commencer →';
  });
  document.getElementById('nom').textContent = nom; document.getElementById('phrase').textContent = phrase;
  for (const [cle, valeur] of Object.entries(jetons)) document.body.style.setProperty('--' + cle, cle === 'scene' ? `url(${valeur})` : valeur);
</script>
</body>
</html>
