<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Prévoyance — trois directions de design</title>
<!-- Trois directions volontairement éloignées du « verre bleu nuit » actuel, sur le même écran (analyse d'un dossier).
     Planche rendue en image par Edge : outils/visuels/variantes.png. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1800px; height: 1280px; background: #e9e9ec; font-family: -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif; display: flex; gap: 60px; justify-content: center; align-items: center; }
  figure { display: grid; gap: 22px; justify-items: center; }
  figcaption { text-align: center; color: #15171c; }
  figcaption b { display: block; font-size: 26px; letter-spacing: -.02em; }
  figcaption span { font-size: 17px; color: #5d636d; }
  .tel { width: 430px; height: 932px; border-radius: 62px; padding: 14px; background: #0c0c0e; box-shadow: 0 50px 90px -40px rgba(0, 0, 0, .55); }
  .ecran { position: relative; width: 100%; height: 100%; border-radius: 50px; overflow: hidden; padding: 64px 26px 0; }
  .ile { position: absolute; left: 50%; top: 14px; width: 118px; height: 34px; margin-left: -59px; border-radius: 20px; background: #000; }
  .heure { position: absolute; left: 34px; top: 21px; font-size: 16px; font-weight: 600; }

  /* ---------- A. Éditorial : papier, sérif, encre et un seul accent */
  .a { background: #f6f3ec; color: #16130f; font-family: "New York", "Iowan Old Style", Georgia, "Times New Roman", serif; }
  .a .sur { font: 600 12px/1 -apple-system, "Segoe UI", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #8b8377; }
  .a h1 { font-size: 40px; font-weight: 400; letter-spacing: -.02em; margin: 22px 0 6px; }
  .a .nb { font-size: 92px; font-weight: 400; letter-spacing: -.045em; line-height: .95; }
  .a .nb small { font: 400 17px -apple-system, "Segoe UI", sans-serif; letter-spacing: 0; color: #8b8377; margin-left: 8px; }
  .a .filet { height: 1px; background: #16130f; margin: 26px 0 0; }
  .a .l { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #d9d3c6; font: 400 17px -apple-system, "Segoe UI", sans-serif; }
  .a .l b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .a .l i { font-style: normal; color: #c2410c; font-weight: 600; }
  .a .cta { margin-top: 26px; height: 58px; border-radius: 4px; background: #16130f; color: #f6f3ec; display: grid; place-items: center; font: 600 17px -apple-system, "Segoe UI", sans-serif; letter-spacing: .01em; }
  .a .note { margin-top: 22px; font-size: 18px; line-height: 1.45; font-style: italic; color: #4a443b; }
  .a .tab { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; border-top: 1px solid #16130f; background: #f6f3ec; display: flex; justify-content: space-around; padding-top: 16px; font: 500 12px -apple-system, "Segoe UI", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #8b8377; }
  .a .tab b { color: #16130f; border-top: 3px solid #c2410c; margin-top: -17px; padding-top: 14px; }

  /* ---------- B. Instrument : noir profond, chiffres mono, anneaux et un accent vif */
  .b { background: #000; color: #f4f4f5; }
  .b .heure { color: #f4f4f5; }
  .b .sur { font: 600 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: #71717a; }
  .b .haut { display: flex; align-items: center; gap: 22px; margin: 22px 0 26px; }
  .b .anneaux { position: relative; width: 176px; height: 176px; flex: none; }
  .b .anneaux svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .b .anneaux div { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 600 44px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: -.04em; }
  .b .anneaux small { display: block; font-size: 11px; letter-spacing: .14em; color: #71717a; margin-top: 4px; }
  .b .nb { font: 600 46px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: -.05em; color: #d4ff3a; }
  .b .nb + p { color: #a1a1aa; font-size: 15px; margin-top: 8px; }
  .b .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .b .c { background: #111113; border: 1px solid #27272a; border-radius: 18px; padding: 14px 16px; }
  .b .c small { display: block; font: 600 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; color: #71717a; }
  .b .c b { display: block; margin-top: 8px; font: 600 22px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: -.03em; }
  .b .c .j { margin-top: 10px; height: 4px; border-radius: 2px; background: #27272a; overflow: hidden; }
  .b .c .j i { display: block; height: 100%; background: #d4ff3a; }
  .b .c.ko b { color: #ff5c5c; } .b .c.ko .j i { background: #ff5c5c; }
  .b .cta { margin-top: 14px; height: 58px; border-radius: 18px; background: #d4ff3a; color: #000; display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  .b .tab { position: absolute; left: 18px; right: 18px; bottom: 22px; height: 64px; border-radius: 22px; background: #111113; border: 1px solid #27272a; display: flex; justify-content: space-around; align-items: center; font: 600 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; color: #71717a; }
  .b .tab b { color: #000; background: #d4ff3a; padding: 9px 12px; border-radius: 12px; }

  /* ---------- C. Chaleureux : sable, formes rondes, vert profond, ton humain */
  .c3 { background: #f3ede2; color: #1f2a24; font-family: "SF Pro Rounded", ui-rounded, -apple-system, "Segoe UI", sans-serif; }
  .c3 .bonjour { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 8px; }
  .c3 .bonjour + p { color: #6b7469; font-size: 16px; margin-top: 4px; }
  .c3 .carte { margin-top: 22px; border-radius: 34px; background: #17402f; color: #f3ede2; padding: 24px 24px 22px; position: relative; overflow: hidden; }
  .c3 .carte::after { content: ""; position: absolute; right: -50px; top: -60px; width: 210px; height: 210px; border-radius: 50%; background: #2a6a4d; }
  .c3 .carte small { position: relative; z-index: 1; font-size: 14px; color: #b8d4c4; font-weight: 600; }
  .c3 .carte .nb { position: relative; z-index: 1; font-size: 58px; font-weight: 700; letter-spacing: -.035em; margin-top: 6px; }
  .c3 .carte p { position: relative; z-index: 1; font-size: 15px; color: #cfe3d7; margin-top: 4px; }
  .c3 .carte .cta { position: relative; z-index: 1; margin-top: 18px; height: 54px; border-radius: 27px; background: #f6c453; color: #1f2a24; display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  .c3 h2 { font-size: 19px; font-weight: 700; margin: 24px 0 12px; }
  .c3 .r { display: flex; align-items: center; gap: 14px; background: #fffaf1; border-radius: 24px; padding: 14px 16px; margin-bottom: 10px; }
  .c3 .r .p { width: 44px; height: 44px; border-radius: 16px; display: grid; place-items: center; font-size: 20px; font-weight: 700; flex: none; }
  .c3 .r div { flex: 1; } .c3 .r div b { display: block; font-size: 17px; } .c3 .r div span { font-size: 14px; color: #6b7469; }
  .c3 .r > b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .c3 .tab { position: absolute; left: 22px; right: 22px; bottom: 24px; height: 68px; border-radius: 34px; background: #fffaf1; box-shadow: 0 14px 30px -16px rgba(31, 42, 36, .35); display: flex; justify-content: space-around; align-items: center; font-size: 13px; font-weight: 600; color: #8a9287; }
  .c3 .tab b { color: #f3ede2; background: #17402f; padding: 12px 18px; border-radius: 22px; }
</style>
<body>

<figure>
  <div class="tel"><div class="ecran a"><div class="ile"></div><span class="heure">9:41</span>
    <p class="sur">Famille Rochat · Retraite</p>
    <h1>Il manque</h1>
    <p class="nb">1’190<small>CHF par mois</small></p>
    <div class="filet"></div>
    <p class="l"><span>Couvert</span><b>83 %</b></p>
    <p class="l"><span>Besoin annuel</span><b>CHF 83’200</b></p>
    <p class="l"><span>Capital à prévoir</span><b>CHF 298’000</b></p>
    <p class="l"><span>Invalidité · maladie</span><i>− CHF 309</i></p>
    <p class="l"><span>Décès · maladie</span><i>− CHF 110</i></p>
    <p class="note">« La retraite est couverte à 83 %. Le 3a et un rachat comblent l’écart. »</p>
    <div class="cta">Lire le conseil</div>
    <div class="tab"><span>Dossier</span><b>Analyse</b><span>Scénarios</span><span>Conseil</span><span>Rapport</span></div>
  </div></div>
  <figcaption><b>A — Éditorial</b><span>Papier, typographie à empattements, encre et un seul accent.<br>L’allure d’une banque privée.</span></figcaption>
</figure>

<figure>
  <div class="tel"><div class="ecran b"><div class="ile"></div><span class="heure">9:41</span>
    <p class="sur">Rochat / Retraite</p>
    <div class="haut">
      <div class="anneaux">
        <svg viewBox="0 0 176 176"><circle cx="88" cy="88" r="78" fill="none" stroke="#1c1c1f" stroke-width="14"/><circle cx="88" cy="88" r="78" fill="none" stroke="#d4ff3a" stroke-width="14" stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="83"/>
          <circle cx="88" cy="88" r="58" fill="none" stroke="#1c1c1f" stroke-width="14"/><circle cx="88" cy="88" r="58" fill="none" stroke="#3ad4ff" stroke-width="14" stroke-linecap="round" stroke-dasharray="364" stroke-dashoffset="120"/>
          <circle cx="88" cy="88" r="38" fill="none" stroke="#1c1c1f" stroke-width="14"/><circle cx="88" cy="88" r="38" fill="none" stroke="#ff5c5c" stroke-width="14" stroke-linecap="round" stroke-dasharray="239" stroke-dashoffset="36"/></svg>
        <div><span>92<small>SCORE</small></span></div>
      </div>
      <div><p class="sur">Lacune</p><p class="nb" style="margin-top:10px">−1’190</p><p>CHF par mois<br>couvert à 83 %</p></div>
    </div>
    <div class="grille">
      <div class="c ko"><small>Retraite</small><b>−1’190</b><div class="j"><i style="width:83%"></i></div></div>
      <div class="c ko"><small>Inval. maladie</small><b>−309</b><div class="j"><i style="width:91%"></i></div></div>
      <div class="c"><small>Inval. accident</small><b>0</b><div class="j"><i style="width:100%"></i></div></div>
      <div class="c ko"><small>Décès maladie</small><b>−110</b><div class="j"><i style="width:97%"></i></div></div>
      <div class="c"><small>1er pilier</small><b>24’648</b><div class="j"><i style="width:30%;background:#3ad4ff"></i></div></div>
      <div class="c"><small>2e pilier</small><b>33’545</b><div class="j"><i style="width:40%;background:#3ad4ff"></i></div></div>
    </div>
    <div class="cta">Voir le plan →</div>
    <div class="tab"><span>Dossier</span><b>Analyse</b><span>Scén.</span><span>Conseil</span><span>Rapport</span></div>
  </div></div>
  <figcaption><b>B — Instrument</b><span>Noir profond, chiffres de tableau de bord, anneaux, un accent vif.<br>L’allure d’un outil de précision.</span></figcaption>
</figure>

<figure>
  <div class="tel"><div class="ecran c3"><div class="ile"></div><span class="heure">9:41</span>
    <p class="bonjour">Famille Rochat</p><p>Voici où en est leur prévoyance.</p>
    <div class="carte"><small>À la retraite, il manquerait</small><p class="nb">CHF 1’190</p><p>par mois · couvert à 83 %</p><div class="cta">Voir comment combler</div></div>
    <h2>Les cinq risques</h2>
    <div class="r"><span class="p" style="background:#fde2c8;color:#b45309">!</span><div><b>Retraite</b><span>couvert à 83 %</span></div><b>− 1’190</b></div>
    <div class="r"><span class="p" style="background:#fde2c8;color:#b45309">!</span><div><b>Invalidité · maladie</b><span>couvert à 91 %</span></div><b>− 309</b></div>
    <div class="r"><span class="p" style="background:#d5ecdc;color:#17402f">✓</span><div><b>Invalidité · accident</b><span>aucune lacune</span></div><b>0</b></div>
    <div class="r"><span class="p" style="background:#fde2c8;color:#b45309">!</span><div><b>Décès · maladie</b><span>couvert à 97 %</span></div><b>− 110</b></div>
    <div class="tab"><span>Dossier</span><b>Analyse</b><span>Scénarios</span><span>Conseil</span></div>
  </div></div>
  <figcaption><b>C — Chaleureux</b><span>Sable et vert profond, formes rondes, phrases simples.<br>L’allure d’une app grand public rassurante.</span></figcaption>
</figure>

</body>
</html>
