<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Prévoyance — essais de l'interface</title>
<style>body { font: 14px/1.5 system-ui, sans-serif; margin: 20px; } iframe { width: 1366px; height: 900px; border: 1px solid #ccc; } .ko { color: #c0392b; font-weight: 700; } .ok { color: #1e8e5a; }</style>
<h1>Essais de l'interface</h1>
<ul id="resultats"></ul>
<iframe id="app" src="index.html#analyse"></iframe>
<script type="module">
  // Pilote l'application dans un cadre et vérifie les interactions principales. S'ouvre dans un navigateur, ou en
  // arrière-plan : msedge --headless --virtual-time-budget=20000 --dump-dom …/web/essais.html
  const liste = document.getElementById('resultats'), cadre = document.getElementById('app');
  const attendre = ms => new Promise(r => setTimeout(r, ms));
  // attend qu'une condition devienne vraie (l'interface se met à jour au rythme de l'écran)
  const jusqua = async (condition, max = 5000) => { for (let i = 0; i < max / 100; i++) { try { if (condition()) return true; } catch { /* pas encore */ } await attendre(100); } return false; };
  const noter = (nom, ok, detail = '') => { const li = document.createElement('li'); li.className = ok ? 'ok' : 'ko'; li.textContent = `${ok ? 'OK' : 'ECHEC'} — ${nom}${detail ? ' : ' + detail : ''}`; liste.append(li); };
  await new Promise(r => cadre.addEventListener('load', r, { once: true }));
  const w = cadre.contentWindow, d = cadre.contentDocument;
  for (let i = 0; i < 60 && !w.__prevoyance?.ctx.analyse; i++) await attendre(100);
  const p = w.__prevoyance;
  try {
    noter('analyse calculée', !!p?.ctx.analyse, `score ${p.ctx.analyse.score}`);
    noter('impôts du canton chargés', p.ctx.analyse.potentiels.canton === 'VD');
    await attendre(1200);
    noter('montants des trois piliers affichés', [...d.querySelectorAll('.scene-puce b')].every(b => /CHF/.test(b.textContent)), [...d.querySelectorAll('.scene-puce b')].map(b => b.textContent).join(' | '));
    // glisser le repère de la retraite sur la ligne de vie
    const toile = d.querySelector('.toile canvas'), b = toile.getBoundingClientRect(), a = p.ctx.analyse.personne;
    const X = age => b.left + 46 + (age - a.age) / (91 - a.age) * (b.width - 46 - 14);
    const ev = (type, x) => toile.dispatchEvent(new w.PointerEvent(type, { clientX: x, clientY: b.top + 60, pointerId: 1, bubbles: true }));
    ev('pointerdown', X(a.ageRetraite)); ev('pointermove', X(63));
    noter('glisser le repère change l’âge de la retraite', await jusqua(() => p.ctx.analyse.personne.ageRetraite === 63), `analyse ${p.ctx.analyse.personne.ageRetraite}, dossier ${p.etat.dossiers[0].ageRetraite}, x ${Math.round(X(63))}, toile ${Math.round(b.left)}+${Math.round(b.width)}`);
    ev('pointermove', X(67)); ev('pointerup', X(67));
    noter('lâcher à 67 ans', await jusqua(() => p.ctx.analyse.personne.ageRetraite === 67), String(p.ctx.analyse.personne.ageRetraite));
    // changer de risque
    d.querySelector('[data-risque=invaliditeMaladie]').click();
    noter('changement de risque', await jusqua(() => /maladie/i.test(d.querySelector('.surtitre').textContent)), d.querySelector('.surtitre').textContent);
    // saisie : le revenu passe à 150 000
    const revenu = d.querySelector('#saisie .montant input'); revenu.value = '150000'; revenu.dispatchEvent(new w.Event('input', { bubbles: true }));
    noter('la saisie recalcule', await jusqua(() => p.ctx.analyse.personne.revenu === 150000), String(p.ctx.analyse.personne.revenu));
    // les autres vues
    for (const [vue, motif] of [['scenarios', /63|65|67/], ['plan', /\d/], ['rapport', /CHF/], ['donnees', /2027/]]) {
      d.querySelector(`#onglets [data-vue=${vue}]`).click();
      const marque = { scenarios: '#scenarios .carte', plan: '.plan-tete', rapport: '.page', donnees: '.donnees-table' }[vue];
      const ok = await jusqua(() => d.body.dataset.vue === vue && d.querySelector('#vue ' + marque) && motif.test(d.getElementById('vue').innerText));
      noter(`vue ${vue}`, ok, `${d.getElementById('vue').innerText.length} caractères, vue ${d.body.dataset.vue}, marque ${!!d.querySelector('#vue ' + marque)}, motif ${motif.test(d.getElementById('vue').innerText)}`);
    }
    d.querySelector('#onglets [data-vue=rapport]').click();
    noter('rapport : au moins six pages', await jusqua(() => d.querySelectorAll('.page').length >= 6), String(d.querySelectorAll('.page').length));
    // conformité : fiche de l'intermédiaire (art. 45 LSA) et procès-verbal de conseil en fin de rapport
    const titres = [...d.querySelectorAll('.page header h2')].map(x => x.textContent);
    noter('rapport : informations de l’intermédiaire et procès-verbal de conseil', titres.includes('Informations de l’intermédiaire') && titres.at(-1) === 'Procès-verbal de conseil', titres.slice(-2).join(' | '));
    noter('rapport : le bandeau signale ce qui manque', /sur \d+/.test(d.querySelector('.conformite h2')?.textContent ?? '') && d.querySelectorAll('.page .a-completer').length > 0, d.querySelector('.conformite h2')?.textContent);
    // verrouillage : chiffrement des dossiers avec un code (dans un stockage d'essai, sans toucher à celui de l'application)
    const Verrou = await import('./src/verrou.js');
    const boite = new Map(), faux = { getItem: k => boite.get(k) ?? null, setItem: (k, v) => boite.set(k, v), removeItem: k => boite.delete(k) };
    const secret = { dossiers: [{ id: 'a', nom: 'Dupont Marie', personne: { revenu: 91000 } }], conseiller: 'Jean Conseiller' };
    await Verrou.creer('code-essai-42', secret, faux, 2000);
    const brut = [...boite.values()].join(' ');
    noter('verrou : rien de lisible dans le coffre', !brut.includes('Dupont') && !brut.includes('91000') && !brut.includes('code-essai'), `${brut.length} caractères`);
    Verrou.fermer();
    noter('verrou : un mauvais code n’ouvre pas', await Verrou.ouvrir('code-essai-43', faux) === null && !Verrou.ouvert());
    const rendu = await Verrou.ouvrir('code-essai-42', faux);
    noter('verrou : le bon code rend les dossiers', rendu?.dossiers[0].nom === 'Dupont Marie' && rendu.conseiller === 'Jean Conseiller' && Verrou.ouvert());
    const avant = boite.get('prevoyance.coffre.v1');
    await Verrou.enregistrer({ ...secret, conseiller: 'Autre' }, faux);
    noter('verrou : chaque enregistrement change de vecteur', JSON.parse(avant).iv !== JSON.parse(boite.get('prevoyance.coffre.v1')).iv);
    const abime = JSON.parse(boite.get('prevoyance.coffre.v1')); abime.donnees = abime.donnees.slice(0, -4) + 'AAAA'; boite.set('prevoyance.coffre.v1', JSON.stringify(abime));
    Verrou.fermer();
    noter('verrou : un contenu altéré est refusé', await Verrou.ouvrir('code-essai-42', faux) === null);
    let refus = false; try { await Verrou.creer('court', secret, faux, 2000); } catch { refus = true; }
    noter('verrou : un code trop court est refusé', refus);
    Verrou.supprimer(faux);
    noter('verrou : coffre supprimé', !Verrou.actif(faux) && !Verrou.ouvert());
    const conf = await import('./src/conformite.js');
    noter('conformité : une fiche vide n’est pas complète, les signatures sont sur la dernière page', conf.controle().some(x => !x.ok) && !!d.querySelector('.page:last-child .r-signatures'));
    // langues
    for (const l of ['de', 'it', 'en', 'fr']) { d.querySelector(`[data-langue=${l}]`).click(); await jusqua(() => d.documentElement.lang === l && d.querySelectorAll('.page').length >= 6); }
    noter('retour au français', d.documentElement.lang === 'fr');
    const manquants = [...d.querySelectorAll('#vue *, #saisie *, .barre *')].filter(e => e.children.length === 0 && /^(a_|s_|sc_|pl_|rp_|dn_|v_|ct_|att_|p_|pr_)\w+$/.test(e.textContent.trim())).map(e => e.textContent.trim());
    noter('aucun texte manquant', manquants.length === 0, manquants.slice(0, 8).join(', '));
    // traductions : chaque langue doit porter exactement les clés du français
    const i18n = await import('./src/i18n.js'), fr = i18n.clesDe('fr');
    for (const l of ['de', 'it', 'en']) {
      const cles = i18n.clesDe(l), absentes = [...fr].filter(c => !cles.has(c)), enTrop = [...cles].filter(c => !fr.has(c));
      noter(`traduction ${l} complète (${cles.size} textes)`, absentes.length === 0 && enTrop.length === 0, [...absentes, ...enTrop].slice(0, 10).join(', '));
    }
    // vitesse du moteur : une analyse complète doit rester très en dessous d'une image à 120 Hz (8,3 ms)
    const moteur = await import('../moteur/src/index.js'), TOURS = 3000, debut = Date.now();
    let temoin = null;
    for (let i = 0; i < TOURS; i++) temoin = moteur.analyser(p.ctx.dossierMoteur, p.ctx.regles, { impots: p.ctx.impots });
    const duree = Date.now() - debut, parAnalyse = duree / TOURS;
    noter('analyse recalculée à l’identique', temoin.score === p.ctx.analyse.score, `score ${temoin.score}`);
    // en arrière-plan (temps virtuel) l'horloge est figée : la vitesse ne se mesure que dans un navigateur ouvert
    if (duree > 0) noter('analyse complète en moins de 4 ms', parAnalyse < 4, `${parAnalyse.toFixed(3)} ms (${TOURS} analyses en ${duree} ms)`);
    // largeur de tablette : le dossier (liste + rubrique) ne s'affiche que sur son onglet, jamais par-dessus une vue
    cadre.style.width = '1180px'; cadre.style.height = '820px';
    const affiche = id => w.getComputedStyle(d.getElementById(id)).display !== 'none';
    for (const vue of ['analyse', 'scenarios', 'plan', 'rapport', 'donnees']) {
      d.querySelector(`#onglets [data-vue=${vue}]`).click(); await jusqua(() => d.body.dataset.vue === vue); await attendre(300);
      noter(`tablette : la vue ${vue} s’affiche seule, sans le dossier`, affiche('vue') && !affiche('saisie'));
    }
    d.querySelector('#onglets [data-vue=dossier]').click(); await attendre(300);
    const visibles = () => [...d.querySelectorAll('#saisie .bloc[data-bloc]')].filter(b => w.getComputedStyle(b).display !== 'none');
    noter('tablette : le dossier montre la liste des rubriques et une seule rubrique', affiche('saisie') && !affiche('vue')
      && w.getComputedStyle(d.querySelector('.rubriques')).display !== 'none' && visibles().length === 1, `${visibles().length} rubrique(s)`);
    d.querySelector('.rubriques [data-rubrique=lpp]').click(); await attendre(200);
    noter('tablette : choisir une rubrique dans la liste l’affiche', visibles().length === 1 && visibles()[0].dataset.bloc === 'lpp');
    noter('tablette (1180 px) : aucun débordement horizontal', d.documentElement.scrollWidth <= 1182, `${d.documentElement.scrollWidth} px`);
    // largeur de téléphone : rien ne dépasse de l'écran
    cadre.style.width = '390px'; cadre.style.height = '844px';
    d.querySelector('#onglets [data-vue=analyse]').click(); await jusqua(() => d.body.dataset.vue === 'analyse' && d.querySelector('.scene-puce'));
    await attendre(600);
    noter('téléphone (390 px) : aucun débordement horizontal', d.documentElement.scrollWidth <= 392, `${d.documentElement.scrollWidth} px`);
    d.querySelector('#onglets [data-vue=dossier]').click(); await attendre(300);
    noter('navigation : « Dossier » ouvre le dossier seul', w.getComputedStyle(d.getElementById('saisie')).display !== 'none' && w.getComputedStyle(d.getElementById('vue')).display === 'none');
    noter('dossier sur téléphone : aucun débordement', d.documentElement.scrollWidth <= 392, `${d.documentElement.scrollWidth} px`);
    d.querySelector('.voir-analyse').click(); await attendre(300);
    noter('« Voir l’analyse » revient à l’analyse', w.getComputedStyle(d.getElementById('vue')).display !== 'none' && d.querySelector('#onglets [data-vue=analyse]').getAttribute('aria-selected') === 'true');
    for (const vue of ['scenarios', 'plan', 'donnees']) {
      d.querySelector(`#onglets [data-vue=${vue}]`).click(); await jusqua(() => d.body.dataset.vue === vue); await attendre(700);
      noter(`téléphone : vue ${vue} sans débordement`, d.documentElement.scrollWidth <= 392, `${d.documentElement.scrollWidth} px`);
    }
  } catch (erreur) {
    noter('exception', false, erreur.stack);
  }
  document.title = `essais : ${liste.querySelectorAll('.ok').length} ok, ${liste.querySelectorAll('.ko').length} échecs`;
  document.body.dataset.fini = 'oui';
</script>
</html>
