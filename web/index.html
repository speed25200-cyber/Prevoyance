<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0a0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2eee5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prévoyance">
<meta name="robots" content="noindex">
<title>Prévoyance — analyse des lacunes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icone-192.png">
<link rel="apple-touch-icon" href="images/icone-180.png">
<link rel="preload" href="polices/inter-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="polices/fraunces-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- le terrain du relief (navigateur d'ordinateur ; un téléphone charge la version légère) -->
<link rel="preload" href="images/terrain/weisshorn.png" as="image" media="(pointer: fine)">
<link rel="preload" href="images/terrain/weisshorn-photo.webp" as="image" media="(pointer: fine)">
<link rel="stylesheet" href="polices/polices.css">
<!-- Les feuilles d'origine sont rangées dans la couche « socle » : l'app iPhone / iPad s'y tient. Dans le navigateur,
     la peau « carte » (carte.css, hors couche) passe toujours devant ; « force », déclarée avant le socle, reprend ce
     qu'il impose avec !important. -->
<style>
@layer force, socle;
@import url("app.css") layer(socle);
@import url("vues.css") layer(socle);
@import url("apple.css") layer(socle);
@import url("haut.css") layer(socle);
@import url("verre.css") layer(socle);
@import url("bureau.css") layer(socle);
@import url("plus.css") layer(socle);
</style>
<link rel="stylesheet" href="carte.css">
<script type="module" src="src/app.js"></script>
</head>
<body>
<header class="barre">
  <div class="marque">
    <img src="images/icone-192.png" alt="" width="34" height="34">
    <div><b data-t="titre">Prévoyance</b><span data-t="sousTitre">Analyse des lacunes</span></div>
  </div>
  <button class="chercher" id="chercher" type="button"><span class="palette-loupe" aria-hidden="true"></span><span data-t="pa_bouton">Rechercher</span><kbd>Ctrl K</kbd></button>
  <nav class="onglets" id="onglets" role="tablist" aria-label="Vues"></nav>
  <div class="actions">
    <button class="lien" id="presentation" type="button" data-t="presentation">Présentation</button>
    <label class="choix-annee"><span data-t="regles">Règles</span><select id="annee" aria-label="Année des règles"></select></label>
    <div class="segments" id="langues" role="group" aria-label="Langue"></div>
  </div>
</header>

<main class="scene">
  <header class="entete-page" id="entete-page" hidden></header>
  <aside class="saisie" id="saisie" aria-label="Dossier du client"></aside>
  <section class="analyse" id="vue" aria-live="polite"></section>
</main>
<div class="bascule-panneau" id="panneaux" role="group"></div>
</body>
</html>
