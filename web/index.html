<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f0e0c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2eee6" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prévoyance">
<meta name="robots" content="noindex">
<title>Prévoyance — analyse des lacunes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="images/icone-192.png">
<link rel="apple-touch-icon" href="images/icone-180.png">
<link rel="preload" href="polices/instrument-serif-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="polices/instrument-sans-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="polices/polices.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="vues.css">
<link rel="stylesheet" href="direction.css">
<script type="module" src="src/app.js"></script>
</head>
<body>
<header class="barre">
  <div class="marque">
    <img src="images/icone-192.png" alt="" width="34" height="34">
    <div><b data-t="titre">Prévoyance</b><span data-t="sousTitre">Analyse des lacunes</span></div>
  </div>
  <nav class="onglets" id="onglets" role="tablist" aria-label="Vues"></nav>
  <div class="actions">
    <button class="lien" id="presentation" type="button" data-t="presentation">Présentation</button>
    <label class="choix-annee"><span data-t="regles">Règles</span><select id="annee" aria-label="Année des règles"></select></label>
    <div class="segments" id="langues" role="group" aria-label="Langue"></div>
  </div>
</header>

<main class="scene">
  <aside class="saisie" id="saisie" aria-label="Dossier du client"></aside>
  <section class="analyse" id="vue" aria-live="polite"></section>
</main>
<div class="bascule-panneau" id="panneaux" role="group"></div>
</body>
</html>
