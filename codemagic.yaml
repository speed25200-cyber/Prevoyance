# Codemagic — application iPad / iPhone « Prévoyance » (dossier ios/).
# Notice : ios/README.md.
#
#   ios-controle    construit l'app pour le simulateur, sans signature : vérifie que le projet compile.
#   ios-testflight  signe, produit l'IPA et l'envoie sur TestFlight.
#
# Aucun secret dans ce fichier. « ios-testflight » demande, côté Codemagic, l'intégration App Store Connect
# et un identifiant d'app (bundle ID) identique à celui de ios/project.yml.

definitions:
  projet: &projet
    name: Générer le projet Xcode
    working_directory: ios
    script: |
      set -e
      xcodebuild -version
      brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      xcodegen generate

workflows:
  ios-controle:
    name: Prévoyance iOS — contrôle
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - *projet
      - name: Construire pour le simulateur
        working_directory: ios
        script: |
          set -o pipefail
          xcodebuild build \
            -project Prevoyance.xcodeproj \
            -scheme Prevoyance \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Vérifier que le moteur et les écrans sont dans l'app
        working_directory: ios
        script: |
          set -e
          APP="build/dd/Build/Products/Debug-iphonesimulator/Prevoyance.app"
          test -f "$APP/web/index.html"
          test -f "$APP/moteur/src/index.js"
          test -f "$APP/moteur/regles/ch-2026.json"
          test -f "$APP/moteur/manifeste.json"
          echo "Contenu embarqué : OK"

  ios-testflight:
    name: Prévoyance iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Dev
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ch.prevoyance.app
    scripts:
      - *projet
      - name: Signature
        working_directory: ios
        script: xcode-project use-profiles
      - name: Numéro de build
        working_directory: ios
        # numéro de build = date et heure (AAMMJJHHMM) : toujours plus grand que le précédent, sans interroger Apple
        script: agvtool new-version -all $(date -u +%y%m%d%H%M)
      - name: IPA
        working_directory: ios
        script: |
          # en cas d'échec, les erreurs du compilateur sont affichées : sans cela le journal ne dit que « Failed to archive »
          xcode-project build-ipa --project Prevoyance.xcodeproj --scheme Prevoyance || {
            echo "==== erreurs de compilation ===="
            grep -h -E "error:|error :|BUILD FAILED|ARCHIVE FAILED|Provisioning profile|entitlement" /tmp/xcodebuild_logs/*.log | sort -u | head -80
            exit 65
          }
      - name: Envoi sur TestFlight
        working_directory: ios
        script: |
          # L'envoi se fait ici plutôt que par la publication automatique : les serveurs d'Apple renvoient parfois une
          # erreur 500 passagère pendant un transfert qui réussit quand même. Seule la confirmation d'Apple compte.
          set +e
          for essai in 1 2 3; do
            app-store-connect publish --path build/ios/ipa/*.ipa 2>&1 | tee envoi.log
            if grep -q "UPLOAD SUCCEEDED" envoi.log; then
              echo "==== Apple confirme la réception du build ===="
              grep -E "Delivery UUID|Version code|Version:" envoi.log | sort -u
              exit 0
            fi
            if grep -q "must be higher than the previously uploaded version" envoi.log; then
              echo "==== Ce numéro de build est déjà chez Apple : l'envoi précédent avait abouti ===="
              exit 0
            fi
            echo "==== envoi non confirmé (essai $essai), nouvelle tentative dans 30 s ===="
            sleep 30
          done
          echo "==== envoi refusé par Apple ===="
          grep -E "ERROR|error" envoi.log | sort -u | head -30
          exit 1
    artifacts:
      - ios/build/ios/ipa/*.ipa
